name: Run tests

on:
  push:
    branches: [main]      # post-merge on main only
  pull_request:           # every PR (branch pushes run here, not twice)

# Cancel superseded runs when a branch/PR is pushed again in quick succession.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    # Experimental legs (3.13) are allowed to fail without cancelling real jobs.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]     # full 3-OS coverage on the primary version
        include:
          # Verify the supported range (requires-python >=3.10; docs say 3.10–3.12),
          # ubuntu-only to keep the job count down.
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.12" }
          # 3.13: experimental (allow-failure) — deps such as numba/llvmlite
          # (via pylablib -> seasenselib) may not have 3.13 wheels yet.
          - { os: ubuntu-latest, python-version: "3.13", experimental: true }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install oceanarray (dev extra = runtime + test + docs + tooling)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        # Coverage gate runs once, on the canonical ubuntu + 3.11 leg; the extra
        # version legs run --no-cov so they only verify install + test pass.
        run: >
          pytest tests/unit -m "not slow and not local and not needs_seasenselib" -q
          ${{ (matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11') && '--cov=oceanarray --cov-report=term-missing --cov-fail-under=38' || '--no-cov' }}

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # seasenselib is a core dependency, so the golden integration tests
      # (stage2/stage3/grid) run for real here rather than skipping.
      - name: Install oceanarray (dev extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run integration tests
        run: pytest tests/integration -m "not local" -q
