name: Run tests

on:
  push:
    branches: [main]      # post-merge on main only
  pull_request:           # every PR (branch pushes run here, not twice)

# Cancel superseded runs when a branch/PR is pushed again in quick succession.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    # Any leg marked experimental is allowed to fail without cancelling real jobs.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]     # full 3-OS coverage on the primary version
        include:
          # Verify the supported range (requires-python >=3.11; docs say 3.11–3.13),
          # ubuntu-only to keep the job count down.
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          # Forward-looking probe for 3.14: allowed to fail (experimental) so a
          # dependency not yet 3.14-ready does not block the required check. Not
          # in the supported range / pyproject classifiers yet.
          - { os: ubuntu-latest, python-version: "3.14", experimental: true }

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.experimental == true }}
          cache: "pip"

      - name: Install oceanarray (test extra = runtime + pytest)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run unit tests
        # Coverage gate runs once, on the canonical ubuntu + 3.11 leg; the extra
        # version legs run --no-cov so they only verify install + test pass.
        env:
          # Windows: the netCDF4 wheel points HDF5_PLUGIN_PATH at its bundled plugins
          # folder, and HDF5 rescans it on every filter query -- xarray calls
          # var.filters() once per variable, so each NETCDF4 open costs ~36 ms/variable
          # on the hosted runner. "::" preloads no plugins. oceanarray writes zlib
          # (built into HDF5), so only zstd/bzip2/blosc files would need them -- none
          # here. No effect on Linux/macOS.
          HDF5_PLUGIN_PRELOAD: "::"
        run: >
          pytest tests/unit -m "not slow and not local and not needs_seasenselib" -q
          ${{ (matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11') && '--cov=oceanarray --cov-report=term-missing --cov-fail-under=58' || '--no-cov' }}

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      # seasenselib is a core dependency, so the golden integration tests
      # (stage2/stage3/grid) run for real here rather than skipping.
      - name: Install oceanarray (test extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run integration tests
        run: pytest tests/integration -m "not local" -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .
