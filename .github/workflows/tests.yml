name: Run tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
      fail-fast: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install oceanarray
        run: pip install -e . --no-deps --force-reinstall

      - name: Run unit tests
        run: pytest tests/unit -m "not slow and not local and not needs_seasenselib" -q

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        # requirements-test.txt = requirements-dev.txt + the PyPI seasenselib
        # release, so the golden integration tests (stage2/stage3/grid) run for
        # real here rather than skipping.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Install oceanarray
        run: pip install -e . --no-deps --force-reinstall

      - name: Run integration tests
        # needs_seasenselib is NOT excluded here: seasenselib is installed above.
        run: pytest tests/integration -m "not local" -q
