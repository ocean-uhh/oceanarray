[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=42",
  "setuptools-scm[toml]>=3.4",
  "wheel",
]

[project]
name = "oceanarray"
description = "Multi-stage processing pipeline for moored oceanographic observations: raw instrument files to QC-flagged CF-compliant NetCDF with automated HTML reports."
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
  { name = "Eleanor Frajka-Williams", email = "eleanorfrajka@gmail.com" },
]
requires-python = ">=3.9"
keywords = [
  "oceanography",
  "mooring",
  "ADCP",
  "CTD",
  "NetCDF",
  "QC",
  "oceanographic-data",
  "AMOC",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Oceanography",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dynamic = [
  "dependencies",
  "version",
]
urls.Documentation = "https://ocean-uhh.github.io/oceanarray"
urls.Homepage = "https://github.com/ocean-uhh/oceanarray"
urls.Repository = "https://github.com/ocean-uhh/oceanarray"
urls."Issue Tracker" = "https://github.com/ocean-uhh/oceanarray/issues"


[project.scripts]
oceanarray = "oceanarray.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["oceanarray", "oceanarray.*"]

[tool.setuptools.package-data]
oceanarray = [
  "oceanarray.mplstyle",
  "config/*.yaml",
  "config/legacy/*.yaml",
]

[tool.setuptools.dynamic]
dependencies = { file = [
  "requirements.txt",
] }
readme = { file = "README.md", content-type = "text/markdown" }

[tool.setuptools_scm]
write_to = "oceanarray/_version.py"
write_to_template = "__version__ = '{version}'"
tag_regex = "^(?P<prefix>v)?(?P<version>[^\\+]+)(?P<suffix>.*)?$"
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[tool.check-manifest]
ignore = [
  "docs",
  "docs/*",
  "notebooks",
  "notebooks/*",
  "tests",
  "tests/*",
]

[tool.coverage.run]
source = ["oceanarray"]
branch = true
omit = [
  "oceanarray/legacy/*",
  "oceanarray/plotters/_cli_legacy.py",  # legacy CLI plots; deleted when oceanarray plot <file> redesign lands (§11)
  "oceanarray/analysis/clock.py",        # unfinished module (plan §14); testing would freeze an interface intended to change
  "oceanarray/_version.py",              # generated by setuptools-scm
]

[tool.ruff]
line-length = 88
exclude = [
  "oceanarray/legacy",   # legacy modules — not maintained to current standards
  "notebooks",           # notebooks are exploratory; not held to production lint standards
  "docs",                # Sphinx conf and vendored third-party code
]

[tool.ruff.lint]
select = [
  "D",       # pydocstyle
  "E",       # pycodestyle errors
  "F",       # pyflakes errors
  "W",       # pycodestyle warnings
  "C90",     # mccabe complexity
  "ANN",     # type annotations
  "B",       # flake8-bugbear
  "BLE",     # bleach checks
  "TRY",     # tryceratops
  "ARG",     # flake8-arguments
  "SLF",     # flake8-self
]
ignore = [
  "D107",    # missing docstring in __init__
  "D203",    # 1 blank line required before class docstring
  "D213",    # multi-line summary docstring style
  "D401",    # first line should be in imperative mood
  "E501",    # line‑length
  "PLR0913", # too many arguments
  "C901",    # complexity
  "ANN401",  # typing.Any is allowed — common in dataset/xarray helper signatures
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D", "SLF001"]   # tests don't need type annotations, docstrings, or private-access guards
"tests/legacy/**" = ["ANN", "D", "SLF001", "ARG001", "E741", "F841"]  # legacy tests: also allow unused fixture args, short variable names, unused locals
"oceanarray/analysis/clock.py" = ["ANN", "D"]  # unfinished module (plan §14); interface will change
"oceanarray/plotters/_cli_legacy.py" = ["ANN", "D"]  # legacy CLI plots; deleted when oceanarray plot <file> redesign lands (§11)
"oceanarray/plotters/__init__.py" = ["ANN", "D", "F401"]  # backward-compat shim re-exports
"oceanarray/tools/rapid_interp.py" = ["ANN", "D", "F841", "SLF001", "TRY003", "BLE001"]  # legacy physics code; rewrite deferred
# Report generators: every function wraps rendering in try/except → None on failure.
# This is the established pattern for keeping HTML reports partially working on bad data.
"oceanarray/report/_plots.py" = ["BLE001", "TRY300", "TRY301", "TRY003"]
"oceanarray/report/_html_helpers.py" = ["BLE001", "TRY300"]
"oceanarray/report/_grid.py" = ["BLE001", "TRY300"]
"oceanarray/report/_instrument.py" = ["BLE001", "TRY300", "ARG001"]
"oceanarray/report/_mooring.py" = ["BLE001", "TRY003", "TRY300"]
"oceanarray/report/_stack.py" = ["BLE001", "TRY300", "ARG001", "F841"]
