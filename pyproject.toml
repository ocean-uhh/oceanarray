[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=42",
  "setuptools-scm[toml]>=3.4",
  "wheel",
]

[project]
name = "oceanarray"
description = "Example template project for docs, pip install and git"
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
  { name = "Eleanor Frajka-Williams", email = "eleanorfrajka@gmail.com" },
]
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dynamic = [
  "dependencies",
  "version",
]
urls.documentation = "https://github.com/ocean-uhh/oceanarray"
urls.homepage = "https://github.com/ocean-uhh/oceanarray"
urls.repository = "https://github.com/ocean-uhh/oceanarray"


[project.scripts]
oceanarray = "oceanarray.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["oceanarray", "oceanarray.*"]

[tool.setuptools.package-data]
oceanarray = [
  "logsheet/data/column_defs.yaml",
  "logsheet/data/latex_templates/*.tex.j2",
]

[tool.setuptools.dynamic]
dependencies = { file = [
  "requirements.txt",
] }
readme = { file = "README.md", content-type = "text/markdown" }

[tool.setuptools_scm]
write_to = "oceanarray/_version.py"
write_to_template = "__version__ = '{version}'"
tag_regex = "^(?P<prefix>v)?(?P<version>[^\\+]+)(?P<suffix>.*)?$"
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[tool.check-manifest]
ignore = [
  "docs",
  "docs/*",
  "notebooks",
  "notebooks/*",
  "tests",
  "tests/*",
]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.coverage.run]
source = ["oceanarray"]
omit = [
  "oceanarray/legacy/*",
]

[tool.ruff]
exclude = [
  "oceanarray/legacy",   # legacy modules — not maintained to current standards
  "notebooks",           # notebooks are exploratory; not held to production lint standards
  "docs",                # Sphinx conf and vendored third-party code
]

[tool.ruff.lint]
select = [
  "D",       # pydocstyle
  "E",       # pycodestyle errors
  "F",       # pyflakes errors
  "W",       # pycodestyle warnings
  "C90",     # mccabe complexity
  "ANN",     # type annotations
  "B",       # flake8-bugbear
  "BLE",     # bleach checks
  "TRY",     # tryceratops
  "ARG",     # flake8-arguments
  "SLF",     # flake8-self
]
ignore = [
  "D107",    # missing docstring in __init__
  "D203",    # 1 blank line required before class docstring
  "D213",    # multi-line summary docstring style
  "D401",    # first line should be in imperative mood
  "E501",    # line‑length
  "PLR0913", # too many arguments
  "C901",    # complexity
  "ANN401",  # typing.Any is allowed — common in dataset/xarray helper signatures
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D", "SLF001"]   # tests don't need type annotations, docstrings, or private-access guards
"tests/legacy/**" = ["ANN", "D", "SLF001", "ARG001", "E741", "F841"]  # legacy tests: also allow unused fixture args, short variable names, unused locals
# tools.py is being reorganised into analysis/ post-OdB; ANN/D deferred until then
"oceanarray/tools.py" = ["ANN", "D205"]
# The following files move to tools/ or pipeline/ post-OdB; ANN/D deferred until then
"oceanarray/clock_offset.py" = ["ANN", "D"]
"oceanarray/find_deployment.py" = ["ANN", "D"]
"oceanarray/plotter.py" = ["ANN", "D"]          # legacy; renamed from plotters.py; migrates to plotters/ post-OdB
"oceanarray/plotters/__init__.py" = ["ANN", "D", "F401"]  # backward-compat shim re-exports
"oceanarray/plotters/_primitives.py" = ["ANN", "D"]
"oceanarray/plotters/_current.py" = ["ANN", "D"]
"oceanarray/readers.py" = ["ANN", "D"]
"oceanarray/writers.py" = ["ANN", "D"]
# rapid_interp.py moves to legacy/ post-OdB; suppress everything until then
"oceanarray/rapid_interp.py" = ["ANN", "D", "F841", "SLF001", "TRY003", "BLE001"]
# Report generators: every function wraps rendering in try/except → None on failure.
# This is the established pattern for keeping HTML reports partially working on bad data.
"oceanarray/report/_plots.py" = ["BLE001", "TRY300"]
"oceanarray/report/_html_helpers.py" = ["BLE001", "TRY300"]
"oceanarray/report/_grid.py" = ["BLE001", "TRY300"]
"oceanarray/report/_instrument.py" = ["BLE001", "TRY300", "ARG001"]
"oceanarray/report/_mooring.py" = ["BLE001", "TRY003", "TRY300"]
"oceanarray/report/_stack.py" = ["BLE001", "TRY300", "ARG001", "F841"]
# Nortek header parsers use except Exception: pass to handle malformed/missing files.
# Stage1 also has TRY003 for a single ValueError with a descriptive message.
"oceanarray/stage1.py" = ["BLE001", "TRY003"]
# Logsheets modules: builders use sys.exit() for user-facing errors (CLI tool pattern),
# BLE001/TRY for broad catches in _firmware.py, ANN/D deferred (internal impl files).
"oceanarray/logsheet/_config.py" = ["BLE001", "TRY003", "ANN", "D"]
"oceanarray/logsheet/_columns.py" = ["BLE001", "TRY003", "ANN", "D"]
"oceanarray/logsheet/__init__.py" = ["D"]
"oceanarray/logsheet/_firmware.py" = ["BLE001", "TRY003", "TRY300", "ANN", "D"]
"oceanarray/logsheet/_latex.py" = ["BLE001", "TRY003", "ANN", "D"]
"oceanarray/logsheet/_render.py" = ["BLE001", "TRY003", "ANN", "D"]
"oceanarray/logsheet/builders/*.py" = ["BLE001", "TRY003", "TRY002", "ANN", "D", "ARG001"]
